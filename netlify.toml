[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://www.owlbear.rodeo"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "https://www.owlbear.rodeo"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "https://www.owlbear.rodeo"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[headers]]
  for = "/js/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://www.owlbear.rodeo"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[headers]]
  for = "/css/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://www.owlbear.rodeo"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[headers]]
  for = "/icon.svg"
  [headers.values]
    Access-Control-Allow-Origin = "https://www.owlbear.rodeo"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# Cache headers para assets estáticos
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "https://www.owlbear.rodeo"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "https://www.owlbear.rodeo"

[[headers]]
  for = "/css/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "https://www.owlbear.rodeo"

[[headers]]
  for = "/js/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "https://www.owlbear.rodeo"

[[headers]]
  for = "/html/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "https://www.owlbear.rodeo"

# Configuración de build
# No se necesita build step - los archivos son estáticos
[build]
  publish = "."
  functions = "netlify/functions"

# Configuración de Deploy Previews (para Pull Requests)
[build.processing]
  skip_processing = false

# Variables de entorno (configúralas en Netlify Dashboard)
# DEBUG_MODE: "true" o "1" activa logs solo en deploy previews/branch deploys.
#   - La función lo mantiene desactivado en el contexto production.
# GM_VAULT_DEFAULT_CONFIG_V2: credencial de una integración de Notion dedicada.
#   - Debe tener acceso de solo lectura exclusivamente a las páginas demo.
#   - Se usa únicamente dentro de las Netlify Functions y nunca se devuelve al cliente.
