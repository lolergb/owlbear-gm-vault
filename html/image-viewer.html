<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image</title>
  <style>
    :root {
      color-scheme: dark;
      --color-text-primary: #fff;
      --color-text-secondary: #e0e0e0;
      --color-text-muted: #aeb0bd;
      --color-surface: rgba(43, 45, 62, 0.96);
      --color-stage: rgba(12, 13, 19, 0.72);
      --color-border: rgba(255, 255, 255, 0.12);
      --spacing-xs: 6px;
      --spacing-sm: 8px;
      --spacing-md: 12px;
      --spacing-lg: 16px;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 12px;
      --font-size-sm: 14px;
      --font-family-base: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      --transition-normal: 0.2s;
      --transition-slow: 0.3s;
      --color-bg-hover: rgba(0, 0, 0, 0.24);
      --color-bg-active: rgba(187, 153, 255, 0.12);
      --color-accent-primary: #967acc;
      --toolbar-button-bg: rgba(0, 0, 0, 0.58);
      --toolbar-button-bg-hover: rgba(0, 0, 0, 0.88);
      --toolbar-button-bg-active: rgba(0, 0, 0, 1);
      --toolbar-button-border: rgba(255, 255, 255, 0.2);
      --toolbar-button-border-hover: rgba(255, 255, 255, 0.42);
      --feedback-bg: #2d4a2d;
      --feedback-border: #4a6a4a;
      --feedback-text: #a6e7a6;
      --icon-size-sm: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(12px, 2vw, 24px);
      color: var(--color-text-secondary);
      background: rgba(8, 9, 14, 0.72);
      font-family: var(--font-family-base);
    }

    button {
      font: inherit;
    }

    [hidden] {
      display: none !important;
    }

    .viewer-shell {
      width: min(1100px, 100%);
      height: min(760px, 100%);
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: var(--spacing-md);
      padding: var(--spacing-md);
      overflow: hidden;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.38);
    }

    .header-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 32px;
    }

    .close-button {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      padding: 0;
      color: var(--color-text-muted);
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 24px;
      line-height: 1;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .close-button:hover {
      color: var(--color-text-primary);
      background: var(--color-bg-hover);
    }

    .close-button:active {
      background: var(--color-bg-active);
    }

    .close-button:focus-visible {
      color: var(--color-text-primary);
      background: var(--color-bg-hover);
      outline: 2px solid var(--color-accent-primary);
      outline-offset: -2px;
    }

    .image-toolbar {
      position: absolute;
      top: var(--image-toolbar-top, var(--spacing-md));
      right: var(--image-toolbar-right, var(--spacing-md));
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--spacing-sm);
    }

    .image-action-button {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      padding: 0;
      color: var(--color-text-secondary);
      background: var(--toolbar-button-bg);
      border: 1px solid var(--toolbar-button-border);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: var(--font-size-sm);
      font-weight: 650;
      line-height: 1;
      transition:
        background var(--transition-normal),
        border-color var(--transition-normal),
        color var(--transition-normal),
        opacity var(--transition-normal);
    }

    .image-action-button:hover,
    .image-action-button:focus-visible {
      color: var(--color-text-primary);
      background: var(--toolbar-button-bg-hover);
      border-color: var(--toolbar-button-border-hover);
      outline: none;
    }

    .image-action-button:active {
      background: var(--toolbar-button-bg-active);
    }

    .image-action-button:focus-visible {
      box-shadow: 0 0 0 2px var(--color-accent-primary);
    }

    .image-action-button:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .image-action-button.shared {
      color: var(--feedback-text);
      background: var(--feedback-bg);
      border-color: var(--feedback-border);
    }

    .image-action-button--size {
      width: auto;
      min-width: 52px;
      padding: 0 var(--spacing-sm);
    }

    .image-action-button img {
      width: var(--icon-size-sm);
      height: var(--icon-size-sm);
      display: block;
      flex-shrink: 0;
    }

    .image-stage {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      display: block;
      overflow: hidden;
      background: transparent;
      border: 0;
      border-radius: var(--radius-lg);
    }

    .image-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: inherit;
    }

    .image-stage img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      flex: 0 0 auto;
      object-fit: contain;
      border-radius: 8px;
      opacity: 0;
      transition: opacity var(--transition-slow);
    }

    .image-stage img.loaded {
      opacity: 1;
    }

    .image-stage.actual-size {
      background: var(--color-stage);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .image-stage.actual-size .image-viewport {
      align-items: flex-start;
      justify-content: flex-start;
      overflow: auto;
      scrollbar-gutter: stable;
    }

    .image-stage.actual-size img {
      max-width: none;
      max-height: none;
      object-fit: none;
    }

    .image-status {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: var(--spacing-lg);
      color: var(--color-text-muted);
      text-align: center;
      pointer-events: none;
    }

    .caption {
      max-height: 3.5rem;
      overflow: auto;
      padding: 0 var(--spacing-sm) var(--spacing-xs);
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
      line-height: 1.4;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .feedback {
      position: fixed;
      bottom: clamp(16px, 3vw, 32px);
      left: 50%;
      z-index: 2;
      max-width: calc(100% - 32px);
      padding: var(--spacing-md) var(--spacing-lg);
      color: var(--feedback-text);
      background: var(--feedback-bg);
      border: 1px solid var(--feedback-border);
      border-radius: var(--radius-md);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
      font-size: var(--font-size-sm);
      text-align: center;
      opacity: 0;
      transform: translate(-50%, 8px);
      pointer-events: none;
      transition:
        opacity var(--transition-slow),
        transform var(--transition-slow);
    }

    .feedback.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 600px), (max-height: 520px) {
      body {
        padding: var(--spacing-sm);
      }

      .viewer-shell {
        width: 100%;
        height: 100%;
        gap: var(--spacing-sm);
        padding: var(--spacing-sm);
        border-radius: var(--radius-md);
      }

      .caption {
        max-height: 2.8rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <section class="viewer-shell" aria-label="Image viewer">
    <div class="header-toolbar" aria-label="Modal controls">
      <button
        id="close-button"
        class="close-button"
        type="button"
        title="Close (Escape)"
        aria-label="Close image"
      >&times;</button>
    </div>

    <main id="image-stage" class="image-stage">
      <div id="image-toolbar" class="image-toolbar" aria-label="Image controls" hidden>
        <button
          id="size-toggle"
          class="image-action-button image-action-button--size"
          type="button"
          title="View at actual size"
          aria-label="View at actual size"
          aria-pressed="false"
          disabled
        >100%</button>
        <button
          id="share-button"
          class="image-action-button"
          type="button"
          title="Show this image to all players"
          aria-label="Show this image to all players"
          hidden
        >
          <img src="../img/icon-players.svg" alt="" />
        </button>
      </div>

      <div id="image-viewport" class="image-viewport">
        <div id="image-loading" class="image-status" role="status">Loading image…</div>
        <div id="image-error" class="image-status" role="alert" hidden>Could not load this image.</div>
        <img id="viewer-image" src="" alt="" />
      </div>
    </main>

    <footer id="viewer-caption" class="caption" hidden></footer>
  </section>

  <div id="feedback" class="feedback" role="status">✓ Image shared with all players</div>

  <script type="module">
    import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3.1.0";

    const urlParams = new URLSearchParams(window.location.search);
    const shareParam = urlParams.get('share');
    const showShareButton = shareParam !== 'false';

    const safeDecode = (value) => {
      if (!value) {
        return '';
      }

      try {
        return decodeURIComponent(value);
      } catch (error) {
        console.warn('Could not decode image viewer parameter:', error);
        return value;
      }
    };

    let imageUrl = safeDecode(urlParams.get('url'));
    const caption = safeDecode(urlParams.get('caption'));

    const imageStage = document.getElementById('image-stage');
    const imageViewport = document.getElementById('image-viewport');
    const imageToolbar = document.getElementById('image-toolbar');
    const viewerImage = document.getElementById('viewer-image');
    const captionElement = document.getElementById('viewer-caption');
    const loadingElement = document.getElementById('image-loading');
    const errorElement = document.getElementById('image-error');
    const sizeToggle = document.getElementById('size-toggle');
    const shareButton = document.getElementById('share-button');
    const closeButton = document.getElementById('close-button');
    const feedback = document.getElementById('feedback');

    const positionImageToolbar = () => {
      if (imageToolbar.hidden || !viewerImage.classList.contains('loaded')) {
        return;
      }

      const viewportRect = imageViewport.getBoundingClientRect();
      const imageRect = viewerImage.getBoundingClientRect();
      const inset = 12;
      const maxTop = Math.max(inset, viewportRect.height - imageToolbar.offsetHeight - inset);
      const maxRight = Math.max(inset, viewportRect.width - imageToolbar.offsetWidth - inset);
      const imageTop = imageRect.top - viewportRect.top + inset;
      const imageRight = viewportRect.right - imageRect.right + inset;
      const top = Math.min(maxTop, Math.max(inset, imageTop));
      const right = Math.min(maxRight, Math.max(inset, imageRight));

      imageStage.style.setProperty('--image-toolbar-top', `${top}px`);
      imageStage.style.setProperty('--image-toolbar-right', `${right}px`);
    };

    const setActualSize = (actualSize) => {
      imageStage.classList.toggle('actual-size', actualSize);
      sizeToggle.setAttribute('aria-pressed', String(actualSize));
      sizeToggle.textContent = actualSize ? 'Fit' : '100%';
      sizeToggle.title = actualSize ? 'Fit image to window' : 'View at actual size';
      sizeToggle.setAttribute('aria-label', sizeToggle.title);

      if (!actualSize) {
        imageViewport.scrollTo({ top: 0, left: 0 });
      }

      requestAnimationFrame(positionImageToolbar);
    };

    const closeViewer = async () => {
      try {
        await OBR.modal.close('notion-image-viewer');
      } catch (error) {
        console.warn('Could not close the image viewer:', error);
      }
    };

    sizeToggle.addEventListener('click', () => {
      setActualSize(!imageStage.classList.contains('actual-size'));
    });

    closeButton.addEventListener('click', closeViewer);

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        event.preventDefault();
        closeViewer();
      }
    });

    document.body.addEventListener('click', (event) => {
      if (event.target === document.body) {
        closeViewer();
      }
    });

    if (caption) {
      captionElement.textContent = caption;
      captionElement.hidden = false;
    }

    viewerImage.addEventListener('load', () => {
      loadingElement.hidden = true;
      errorElement.hidden = true;
      viewerImage.classList.add('loaded');
      sizeToggle.disabled = false;
      imageToolbar.hidden = false;
      requestAnimationFrame(positionImageToolbar);
    });

    viewerImage.addEventListener('error', () => {
      loadingElement.hidden = true;
      errorElement.hidden = false;
      viewerImage.classList.remove('loaded');
      sizeToggle.disabled = true;
      imageToolbar.hidden = true;
    });

    window.addEventListener('resize', positionImageToolbar);

    if ('ResizeObserver' in window) {
      const imageResizeObserver = new ResizeObserver(positionImageToolbar);
      imageResizeObserver.observe(imageViewport);
      imageResizeObserver.observe(viewerImage);
    }

    if (imageUrl) {
      if (!/^https?:\/\//i.test(imageUrl)) {
        try {
          imageUrl = new URL(imageUrl, window.location.origin).toString();
        } catch (error) {
          console.error('Could not build an absolute image URL:', error);
        }
      }

      viewerImage.alt = caption || 'Image';
      viewerImage.src = imageUrl;
    } else {
      loadingElement.hidden = true;
      errorElement.textContent = 'No image URL was provided.';
      errorElement.hidden = false;
    }

    OBR.onReady(async () => {
      try {
        const playerId = await OBR.player.getId();

        if (showShareButton && imageUrl) {
          shareButton.hidden = false;
          requestAnimationFrame(positionImageToolbar);

          shareButton.addEventListener('click', async (event) => {
            event.preventDefault();
            event.stopPropagation();

            try {
              shareButton.disabled = true;

              await OBR.broadcast.sendMessage('com.dmscreen/showImage', {
                url: imageUrl,
                caption,
                senderId: playerId
              });

              feedback.classList.add('visible');
              shareButton.classList.add('shared');

              setTimeout(() => {
                feedback.classList.remove('visible');
                shareButton.classList.remove('shared');
                shareButton.disabled = false;
              }, 2000);
            } catch (error) {
              console.error('Could not share image:', error);
              shareButton.disabled = false;
              const message = error?.error?.message || error?.message || String(error);
              alert('Error sharing image: ' + message);
            }
          });
        }
      } catch (error) {
        console.warn('Could not initialize image sharing:', error);
      }
    });
  </script>
</body>
</html>
