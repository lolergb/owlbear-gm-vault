<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image</title>
  <style>
    :root {
      color-scheme: dark;
      --color-text-primary: #fff;
      --color-text-secondary: #e0e0e0;
      --color-text-muted: #aeb0bd;
      --color-surface: rgba(43, 45, 62, 0.96);
      --color-stage: rgba(12, 13, 19, 0.72);
      --color-border: rgba(255, 255, 255, 0.12);
      --spacing-xs: 6px;
      --spacing-sm: 8px;
      --spacing-md: 12px;
      --spacing-lg: 16px;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 12px;
      --font-size-sm: 14px;
      --font-family-base: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      --transition-normal: 0.2s;
      --transition-slow: 0.3s;
      --color-bg-hover: rgba(0, 0, 0, 0.24);
      --color-bg-active: rgba(187, 153, 255, 0.12);
      --color-accent-primary: #967acc;
      --feedback-bg: #2d4a2d;
      --feedback-border: #4a6a4a;
      --feedback-text: #a6e7a6;
      --radius-full: 50%;
      --icon-size-md: 20px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(12px, 2vw, 24px);
      color: var(--color-text-secondary);
      background: rgba(8, 9, 14, 0.72);
      font-family: var(--font-family-base);
    }

    button {
      font: inherit;
    }

    [hidden] {
      display: none !important;
    }

    .viewer-shell {
      width: min(1100px, 100%);
      height: min(760px, 100%);
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: var(--spacing-md);
      padding: var(--spacing-md);
      overflow: hidden;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.38);
    }

    .header-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--spacing-sm);
      min-height: 32px;
    }

    .close-button {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      padding: 0;
      color: var(--color-text-muted);
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 24px;
      line-height: 1;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .close-button:hover {
      color: var(--color-text-primary);
      background: var(--color-bg-hover);
    }

    .close-button:active {
      background: var(--color-bg-active);
    }

    .close-button:focus-visible {
      color: var(--color-text-primary);
      background: var(--color-bg-hover);
      outline: 2px solid var(--color-accent-primary);
      outline-offset: -2px;
    }

    .header-action-button {
      position: relative;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      padding: 0;
      color: var(--color-text-secondary);
      background: transparent;
      border: none;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-size: var(--font-size-sm);
      font-weight: 650;
      line-height: 1;
      transition:
        background var(--transition-normal),
        color var(--transition-normal),
        opacity var(--transition-normal);
    }

    .header-action-button:hover,
    .header-action-button:focus-visible {
      color: var(--color-text-primary);
      background: var(--color-bg-hover);
      outline: none;
    }

    .header-action-button:active {
      background: var(--color-bg-active);
    }

    .header-action-button:focus-visible {
      box-shadow: 0 0 0 2px var(--color-accent-primary);
    }

    .header-action-button:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .header-action-button[aria-busy="true"] {
      opacity: 1;
      cursor: progress;
    }

    .header-action-button[aria-busy="true"] .share-icon {
      opacity: 0;
    }

    .header-action-button[aria-busy="true"]::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      transform-origin: center;
      animation: share-button-spin 0.7s linear infinite;
      pointer-events: none;
    }

    .header-action-button.shared {
      color: var(--feedback-text);
      background: var(--feedback-bg);
    }

    @keyframes share-button-spin {
      to { transform: rotate(360deg); }
    }

    .header-action-button--size {
      width: auto;
      min-width: 52px;
      padding: 0 var(--spacing-sm);
      border-radius: 999px;
    }

    .header-action-button .share-icon {
      width: var(--icon-size-md);
      height: var(--icon-size-md);
      display: block;
      flex-shrink: 0;
    }

    .image-stage {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: transparent;
      border: 0;
      border-radius: var(--radius-lg);
    }

    .image-stage img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      flex: 0 0 auto;
      object-fit: contain;
      border-radius: 8px;
      opacity: 0;
      transition: opacity var(--transition-slow);
    }

    .image-stage img.loaded {
      opacity: 1;
    }

    .image-stage.actual-size {
      align-items: flex-start;
      justify-content: flex-start;
      overflow: auto;
      background: var(--color-stage);
      border: 1px solid rgba(255, 255, 255, 0.06);
      scrollbar-gutter: stable;
    }

    .image-stage.actual-size img {
      max-width: none;
      max-height: none;
      object-fit: none;
    }

    .image-status {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: var(--spacing-lg);
      color: var(--color-text-muted);
      text-align: center;
      pointer-events: none;
    }

    .caption {
      max-height: 3.5rem;
      overflow: auto;
      padding: 0 var(--spacing-sm) var(--spacing-xs);
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
      line-height: 1.4;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .feedback {
      position: fixed;
      bottom: clamp(16px, 3vw, 32px);
      left: 50%;
      z-index: 2;
      max-width: calc(100% - 32px);
      padding: var(--spacing-md) var(--spacing-lg);
      color: var(--feedback-text);
      background: var(--feedback-bg);
      border: 1px solid var(--feedback-border);
      border-radius: var(--radius-md);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
      font-size: var(--font-size-sm);
      text-align: center;
      opacity: 0;
      transform: translate(-50%, 8px);
      pointer-events: none;
      transition:
        opacity var(--transition-slow),
        transform var(--transition-slow);
    }

    .feedback.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .feedback[data-variant="warning"] {
      color: #ffe2a8;
      background: #4a3b22;
      border-color: #765f36;
    }

    .feedback[data-variant="error"] {
      color: #ffc6c6;
      background: #4a282d;
      border-color: #754047;
    }

    @media (max-width: 600px), (max-height: 520px) {
      body {
        padding: var(--spacing-sm);
      }

      .viewer-shell {
        width: 100%;
        height: 100%;
        gap: var(--spacing-sm);
        padding: var(--spacing-sm);
        border-radius: var(--radius-md);
      }

      .caption {
        max-height: 2.8rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .header-action-button[aria-busy="true"]::after {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <section class="viewer-shell" aria-label="Image viewer">
    <div class="header-toolbar" aria-label="Modal controls">
      <button
        id="size-toggle"
        class="header-action-button header-action-button--size"
        type="button"
        title="View at actual size"
        aria-label="View at actual size"
        aria-pressed="false"
        disabled
      >100%</button>
      <button
        id="share-button"
        class="header-action-button"
        type="button"
        title="Show this image to all players"
        aria-label="Show this image to all players"
        hidden
      >
        <svg class="share-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
            <path d="M7.667 11.001a2.667 2.667 0 1 0 0-5.333 2.667 2.667 0 0 0 0 5.333Z" />
            <path d="M12.812 20.164c.697-.233 1.106-.992.848-1.679-.913-2.424-3.248-4.149-5.992-4.149-2.744 0-5.079 1.725-5.992 4.149-.259.688.15 1.446.848 1.679 1.283.428 3.041.837 5.145.837 2.103 0 3.862-.409 5.143-.837Z" />
            <path d="M16 7.669a2.667 2.667 0 1 0 0-5.333 2.667 2.667 0 0 0 0 5.333Z" />
            <path d="M17.539 17.585c1.424-.137 2.652-.434 3.605-.753.697-.233 1.106-.992.848-1.679-.913-2.424-3.248-4.149-5.992-4.149-1.119 0-2.161.301-3.076.805" />
          </g>
        </svg>
      </button>
      <button
        id="close-button"
        class="close-button"
        type="button"
        title="Close (Escape)"
        aria-label="Close image"
      >&times;</button>
    </div>

    <main id="image-stage" class="image-stage">
      <div id="image-loading" class="image-status" role="status">Loading image…</div>
      <div id="image-error" class="image-status" role="alert" hidden>Could not load this image.</div>
      <img id="viewer-image" src="" alt="" referrerpolicy="no-referrer" />
    </main>

    <footer id="viewer-caption" class="caption" hidden></footer>
  </section>

  <div id="feedback" class="feedback" role="status">✓ Image shared with all players</div>

  <script type="module">
    import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3.1.0";
    import {
      IMAGE_SHARE_STATUS,
      sendImageShareStatus,
      shareImageWithPlayers
    } from "../js/services/ImageShareService.js";
    import { runShareButtonAction } from "../js/utils/shareButtonState.js?v=20260722-4";
    import { sanitizeImageUrl } from "../js/utils/htmlSecurity.js?v=20260722-4";
    import { AnalyticsService } from "../js/services/AnalyticsService.js?v=20260906-8";

    const urlParams = new URLSearchParams(window.location.search);
    const shareParam = urlParams.get('share');
    const showShareButton = shareParam !== 'false';
    const promptShare = urlParams.get('promptShare') === 'true';

    const safeDecode = (value) => {
      if (!value) {
        return '';
      }

      try {
        return decodeURIComponent(value);
      } catch (error) {
        console.warn('Could not decode image viewer parameter:', error);
        return value;
      }
    };

    let imageUrl = safeDecode(urlParams.get('url'));
    const caption = safeDecode(urlParams.get('caption'));
    const shareId = urlParams.get('shareId') || '';
    const senderConnectionId = urlParams.get('senderConnectionId') || '';

    const imageStage = document.getElementById('image-stage');
    const viewerImage = document.getElementById('viewer-image');
    const captionElement = document.getElementById('viewer-caption');
    const loadingElement = document.getElementById('image-loading');
    const errorElement = document.getElementById('image-error');
    const sizeToggle = document.getElementById('size-toggle');
    const shareButton = document.getElementById('share-button');
    const closeButton = document.getElementById('close-button');
    const feedback = document.getElementById('feedback');
    const analyticsService = new AnalyticsService();
    const viewerContext = shareId ? 'shared' : 'detail';
    let analyticsReady = Promise.resolve();
    let obrReady = false;
    let pendingLoadStatus = null;
    let loadStatusSent = false;
    let loadStatusAttempts = 0;
    let feedbackTimer = null;

    const showFeedback = (message, variant = 'success', autoHideMs = 0) => {
      if (feedbackTimer) clearTimeout(feedbackTimer);
      feedback.textContent = message;
      feedback.dataset.variant = variant;
      feedback.classList.add('visible');

      if (autoHideMs > 0) {
        feedbackTimer = setTimeout(() => {
          feedback.classList.remove('visible');
        }, autoHideMs);
      }
    };

    const reportImageLoadStatus = async (status, reason = '') => {
      if (!shareId || !senderConnectionId || loadStatusSent) return;
      pendingLoadStatus = { status, reason };
      if (!obrReady) return;

      loadStatusSent = true;
      loadStatusAttempts += 1;
      try {
        await sendImageShareStatus(OBR, {
          shareId,
          targetConnectionId: senderConnectionId,
          status,
          reason
        });
      } catch (error) {
        loadStatusSent = false;
        console.warn('Could not report image load status:', error);
        if (loadStatusAttempts < 2) {
          setTimeout(
            () => reportImageLoadStatus(status, reason),
            500
          );
        }
      }
    };

    const renderShareProgress = (progress) => {
      const total = progress.total || 0;
      const unresolved = (progress.missing || 0) + (progress.loading || 0);

      if (progress.phase === 'sending') {
        showFeedback(`Sending image to ${total} player${total === 1 ? '' : 's'}…`);
      } else if (progress.phase === 'retrying') {
        showFeedback(`Checking delivery for ${progress.pending} player${progress.pending === 1 ? '' : 's'}…`, 'warning');
      } else if (progress.phase === 'progress') {
        showFeedback(`Visible to ${progress.loaded}/${total} players…`);
      } else if (progress.phase === 'no_recipients') {
        showFeedback('No players connected', 'warning', 3000);
      } else if (progress.phase === 'complete') {
        const details = [];
        if (progress.failed) details.push(`${progress.failed} could not display`);
        if (unresolved) details.push(`${unresolved} did not confirm`);
        showFeedback(
          `Visible to ${progress.loaded}/${total} players${details.length ? ` · ${details.join(' · ')}` : ''}`,
          details.length ? 'warning' : 'success',
          3500
        );
      } else if (progress.phase === 'error') {
        showFeedback('Could not share this image', 'error', 3500);
      }
    };

    const setActualSize = (actualSize) => {
      imageStage.classList.toggle('actual-size', actualSize);
      sizeToggle.setAttribute('aria-pressed', String(actualSize));
      sizeToggle.textContent = actualSize ? 'Fit' : '100%';
      sizeToggle.title = actualSize ? 'Fit image to window' : 'View at actual size';
      sizeToggle.setAttribute('aria-label', sizeToggle.title);

      if (!actualSize) {
        imageStage.scrollTo({ top: 0, left: 0 });
      }
    };

    const closeViewer = async () => {
      if (shareId && senderConnectionId && !loadStatusSent) {
        const finalStatus = pendingLoadStatus || {
          status: IMAGE_SHARE_STATUS.FAILED,
          reason: 'viewer_closed'
        };
        await Promise.race([
          reportImageLoadStatus(finalStatus.status, finalStatus.reason),
          new Promise((resolve) => setTimeout(resolve, 250))
        ]);
      }

      try {
        await OBR.modal.close('notion-image-viewer');
      } catch (error) {
        console.warn('Could not close the image viewer:', error);
      }
    };

    sizeToggle.addEventListener('click', () => {
      const actualSize = !imageStage.classList.contains('actual-size');
      setActualSize(actualSize);
      void analyticsReady.then(() => {
        analyticsService.trackImageViewerZoom(
          actualSize ? 'actual_size' : 'fit',
          viewerContext
        );
      });
    });

    closeButton.addEventListener('click', closeViewer);

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        event.preventDefault();
        closeViewer();
      }
    });

    document.body.addEventListener('click', (event) => {
      if (event.target === document.body) {
        closeViewer();
      }
    });

    window.addEventListener('pagehide', () => {
      if (shareId && senderConnectionId && !loadStatusSent) {
        const finalStatus = pendingLoadStatus || {
          status: IMAGE_SHARE_STATUS.FAILED,
          reason: 'viewer_closed'
        };
        reportImageLoadStatus(finalStatus.status, finalStatus.reason);
      }
    });

    if (caption) {
      captionElement.textContent = caption;
      captionElement.hidden = false;
    }

    viewerImage.addEventListener('load', () => {
      loadingElement.hidden = true;
      errorElement.hidden = true;
      viewerImage.classList.add('loaded');
      sizeToggle.disabled = false;
      reportImageLoadStatus(IMAGE_SHARE_STATUS.LOADED);
    });

    viewerImage.addEventListener('error', () => {
      loadingElement.hidden = true;
      errorElement.hidden = false;
      viewerImage.classList.remove('loaded');
      sizeToggle.disabled = true;
      reportImageLoadStatus(IMAGE_SHARE_STATUS.FAILED, 'image_load_failed');
    });

    if (imageUrl) {
      try {
        imageUrl = sanitizeImageUrl(new URL(imageUrl, window.location.origin).href);
      } catch (error) {
        console.error('Could not validate the image URL:', error);
        imageUrl = '';
      }
    }

    if (imageUrl) {
      viewerImage.alt = caption || 'Image';
      viewerImage.src = imageUrl;
    } else {
      loadingElement.hidden = true;
      errorElement.textContent = 'No image URL was provided.';
      errorElement.hidden = false;
    }

    OBR.onReady(async () => {
      try {
        analyticsService.setOBR(OBR);
        analyticsReady = analyticsService.init({
          trackExtensionOpened: false,
          showConsentBanner: false
        }).then(() => {
          analyticsService.trackImageViewerOpened(viewerContext);
        }).catch((error) => {
          console.warn('Could not initialize image viewer analytics:', error);
        });

        obrReady = true;
        if (pendingLoadStatus) {
          reportImageLoadStatus(pendingLoadStatus.status, pendingLoadStatus.reason);
        }

        if (showShareButton && imageUrl) {
          shareButton.hidden = false;
          if (promptShare) {
            showFeedback('Review the image and press Share to send it to players', 'warning', 5000);
          }

          shareButton.addEventListener('click', async (event) => {
            event.preventDefault();
            event.stopPropagation();

            try {
              await runShareButtonAction(
                shareButton,
                async () => {
                  const result = await shareImageWithPlayers({
                    OBR,
                    url: imageUrl,
                    caption,
                    onProgress: renderShareProgress
                  });
                  void analyticsReady.then(() => {
                    analyticsService.trackImageShareResult(result);
                    if (result.loaded > 0) {
                      analyticsService.trackImageShare(imageUrl);
                    }
                  });
                  return result.phase === 'complete' && result.loaded > 0;
                },
                {
                  busyLabel: 'Sharing image…',
                  successLabel: 'Image shared with players',
                  successMs: 2000
                }
              );
            } catch (error) {
              console.error('Could not share image:', error);
              const message = error?.error?.message || error?.message || String(error);
              showFeedback(`Could not share this image: ${message}`, 'error', 3500);
            }
          });
        }
      } catch (error) {
        console.warn('Could not initialize image sharing:', error);
      }
    });
  </script>
</body>
</html>
